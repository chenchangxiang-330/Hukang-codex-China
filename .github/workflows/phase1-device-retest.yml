name: Phase 1 offline device retest of inspected release

on:
  push:
    branches: [codex/mainland-v2]
    paths:
      - .github/workflows/phase1-device-retest.yml
      - .github/workflows/phase1-device.yml
      - scripts/run-android-ocr-lab.py
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Existing successful release run in this repository
        required: true
        default: "37776005573"
        type: string
      build_sha:
        description: Exact release source SHA matching that run's official receipt
        required: true
        default: "339a66991af93c488e1f1426a3f240edd82fc3ca"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: phase1-device-retest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  device:
    uses: ./.github/workflows/phase1-device.yml
    with:
      build_run_id: ${{ inputs.build_run_id || '37776005573' }}
      build_sha: ${{ inputs.build_sha || '339a66991af93c488e1f1426a3f240edd82fc3ca' }}
