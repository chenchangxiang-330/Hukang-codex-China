name: Simple app Android acceptance
on:
  workflow_run:
    workflows: ['Hukang simple app APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful main APK build run
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  device:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hukang-*
          merge-multiple: true
          path: artifacts/build
          run-id: ${{ inputs.build_run || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Check exact binary before starting emulator
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts/build');apks=sorted(root.glob('hukang-*-arm64.apk'));assert len(apks)==1, apks;apk=apks[0];check=json.loads((root/'apk-inspection.json').read_text())
          assert apk.is_file() and hashlib.sha256(apk.read_bytes()).hexdigest()==check['sha256']
          assert not check['errors'] and 'android.permission.INTERNET' not in check['permissions']
          print('APK source:',(root/'source-commit.txt').read_text()); print('APK SHA256:',check['sha256'])
          PY
      - name: Enable emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute actual installed ARM64 APK offline
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disk-size: 6G
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene -camera-front none -no-metrics
          script: python3 tests/device/simple-device.py
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simple-device-${{ github.run_id }}
          path: artifacts/device/
          retention-days: 14
          if-no-files-found: warn
