name: Simple app Android acceptance
on:
  push:
    branches: [main]
    paths: ['tests/device/**', '.github/workflows/simple-app-device.yml']
  workflow_run:
    workflows: ['Hukang simple app APK']
    types: [completed]
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful APK build run (exact binary replay; no rebuild)
        required: true
        type: string
permissions:
  contents: read
  actions: read
env:
  # Test-only fixes can replay this already inspected binary. The source guard
  # below rejects runtime changes, which require a fresh release build.
  VERIFIED_BUILD_RUN: '38703696958'
jobs:
  device:
    # Runtime commits marked [fresh-apk] await workflow_run for their new APK.
    # Test-only pushes may replay the inspected binary guarded below.
    if: (github.event_name == 'push' && !contains(github.event.head_commit.message, '[fresh-apk]')) || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: hukang-*
          merge-multiple: true
          path: artifacts/build
          run-id: ${{ inputs.build_run || github.event.workflow_run.id || env.VERIFIED_BUILD_RUN }}
          github-token: ${{ github.token }}
      - name: Check exact binary before starting emulator
        env:
          EXPECTED_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('artifacts/build');apks=sorted(root.glob('hukang-*-arm64.apk'));assert len(apks)==1, apks;apk=apks[0];check=json.loads((root/'apk-inspection.json').read_text())
          assert apk.is_file() and hashlib.sha256(apk.read_bytes()).hexdigest()==check['sha256']
          assert not check['errors']
          assert all(p not in check['permissions'] for p in ['android.permission.INTERNET', 'android.permission.ACCESS_NETWORK_STATE'])
          import os
          source=(root/'source-commit.txt').read_text().strip()
          expected=os.environ.get('EXPECTED_BUILD_SHA')
          assert not expected or source==expected, (source, expected)
          print('APK source:',(root/'source-commit.txt').read_text()); print('APK SHA256:',check['sha256'])
          PY
      - name: Reject runtime differences when replaying an existing APK
        run: |
          set -euo pipefail
          built_source="$(cat artifacts/build/source-commit.txt)"
          [[ "$built_source" =~ ^[0-9a-f]{40}$ ]]
          git cat-file -e "$built_source^{commit}" || git fetch --no-tags --depth=1 origin "$built_source"
          git diff --exit-code "$built_source" HEAD -- src modules android plugins assets package.json package-lock.json app.json babel.config.js metro.config.js
          mkdir -p artifacts/device
          git rev-parse HEAD > artifacts/device/test-source-commit.txt
          cp artifacts/build/source-commit.txt artifacts/device/apk-source-commit.txt
      - name: Enable emulator acceleration
        run: |
          test -c /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute actual installed ARM64 APK offline
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          cores: 2
          ram-size: 4096M
          heap-size: 768M
          disk-size: 6G
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back virtualscene -camera-front none -no-metrics
          script: python3 tests/device/run-acceptance.py
      - name: Preserve success or failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simple-device-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: artifacts/device/
          retention-days: 14
          if-no-files-found: warn
