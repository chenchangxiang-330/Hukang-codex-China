name: Hukang simple app APK
on:
  push:
    branches: [main]
    paths: ['src/**', 'modules/**', 'android/**', 'plugins/**', 'scripts/**', 'package*.json', 'app.json', '.delivery/**', '.github/workflows/simple-app-release.yml']
  workflow_dispatch:
concurrency:
  group: simple-apk-main
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record exact built source
        id: source
        run: |
          test -z "$(git status --porcelain)"
          mkdir -p artifacts
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > artifacts/source-commit.txt
          git archive --format=tar.gz HEAD > artifacts/source.tar.gz
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Typecheck and database/domain/export tests
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm run typecheck
          npm test | tee artifacts/tests.txt
          python -B -m unittest discover -s tests -p 'test_*.py'
      - name: Bundle fixed official offline OCR models
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          if ! python scripts/fetch-models.py --source bos --receipt artifacts/official-model-acquisition.json; then
            python scripts/fetch-models.py --source hf --receipt artifacts/official-model-acquisition.json
          fi
          python scripts/fetch-models.py --verify
          npm run verify:assets
      - name: Install Android build components
        run: |
          set -euo pipefail
          sdk_dir="$(printenv ANDROID_HOME || printenv ANDROID_SDK_ROOT || true)"
          test -d "$sdk_dir"
          sdk_manager=""
          for candidate in "$sdk_dir/cmdline-tools/latest/bin/sdkmanager" "$sdk_dir"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$candidate" ]; then sdk_manager="$candidate"; break; fi
          done
          test -n "$sdk_manager"
          echo "ANDROID_HOME=$sdk_dir" >> "$GITHUB_ENV"
          "$sdk_manager" --sdk_root="$sdk_dir" 'platforms;android-36' 'build-tools;36.0.0' 'ndk;27.0.12077973' 'ndk;27.1.12297006' 'cmake;3.22.1'
      - name: Protected signing or clearly identified test signature
        env:
          KEYSTORE: ${{ secrets.HUKANG_RELEASE_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.HUKANG_RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HUKANG_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HUKANG_RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$KEYSTORE" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/hukang-release.keystore"
            chmod 600 "$RUNNER_TEMP/hukang-release.keystore"
            {
              echo "HUKANG_RELEASE_KEYSTORE=$RUNNER_TEMP/hukang-release.keystore"
              echo "HUKANG_RELEASE_STORE_PASSWORD=$STORE_PASSWORD"
              echo "HUKANG_RELEASE_KEY_ALIAS=$KEY_ALIAS"
              echo "HUKANG_RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo protected > artifacts/signing-mode.txt
          elif [ -n "$KEYSTORE$STORE_PASSWORD$KEY_ALIAS$KEY_PASSWORD" ]; then
            echo 'Signing configuration is incomplete; refusing to substitute a new signature.' >&2
            exit 1
          else
            keytool -genkeypair -noprompt -storetype JKS -keystore android/app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 90 -dname 'CN=Hukang 0.3.2 Test, OU=Local App, O=Hukang, C=CN'
            echo 'ephemeral-test; cannot promise an in-place update of previous installs' > artifacts/signing-mode.txt
          fi
      - name: Build actual ARM64 release
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --max-workers=2 -PreactNativeArchitectures=arm64-v8a -Dorg.gradle.jvmargs='-Xmx4g -XX:MaxMetaspaceSize=1g' 2>&1 | tee ../artifacts/gradle-release.log
      - name: Exercise native barcode decoder with synthetic images
        working-directory: android
        run: ./gradlew :hukang-barcode:testReleaseUnitTest --no-daemon --max-workers=2
      - name: Inspect resolved runtime dependencies
        working-directory: android
        run: |
          set -euo pipefail
          ./gradlew :app:dependencies --configuration releaseRuntimeClasspath --no-daemon > ../artifacts/runtime-dependencies.txt
          if grep -E 'com\.google\.(mlkit|firebase)|com\.google\.android\.gms|camera-mlkit-vision' ../artifacts/runtime-dependencies.txt; then
            echo 'Forbidden production recognition or Google service dependency' >&2
            exit 1
          fi
      - name: Verify APK identity, offline permissions, model hashes and signature
        run: |
          set -euo pipefail
          cp android/app/build/outputs/apk/release/app-release.apk artifacts/hukang-0.3.2-arm64.apk
          python scripts/verify-apk.py artifacts/hukang-0.3.2-arm64.apk --output artifacts/apk-inspection.json
          sha256sum artifacts/hukang-0.3.2-arm64.apk > artifacts/apk-sha256.txt
      - name: Publish small build inspection evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-inspection-${{ steps.source.outputs.sha }}
          path: |
            artifacts/apk-inspection.json
            artifacts/apk-sha256.txt
            artifacts/final-manifest.txt
            artifacts/source-commit.txt
            artifacts/signing-mode.txt
            artifacts/official-model-acquisition.json
            artifacts/tests.txt
            artifacts/runtime-dependencies.txt
          if-no-files-found: error
          retention-days: 14
      - name: Publish complete APK and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hukang-0.3.2-${{ steps.source.outputs.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Report validation boundary
        run: |
          echo 'Built source: ${{ steps.source.outputs.sha }}' >> "$GITHUB_STEP_SUMMARY"
          echo 'Static tests and release inspection do not establish OPPO physical-camera, upgrade or sharing success.' >> "$GITHUB_STEP_SUMMARY"
