name: Simple app checks
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --include=dev
      - name: Package exact public source and local typecheck dependencies
        run: |
          mkdir -p /tmp/hukang-snapshot
          git archive --format=tar.gz HEAD > /tmp/hukang-snapshot/source.tar.gz
          tar -czf /tmp/hukang-snapshot/dependencies.tar.gz node_modules
          git rev-parse HEAD > /tmp/hukang-snapshot/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: main-source-${{ github.sha }}
          path: /tmp/hukang-snapshot/
          retention-days: 3
      - run: npm run typecheck
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: npm run verify:assets
